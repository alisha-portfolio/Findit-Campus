<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FindIt Campus: report lost items, post found items, and get smart match suggestions on one campus." />
    <meta name="theme-color" content="#12284c" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <title>Administrator login · FindIt Campus</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <a class="skip-link" href="#main">Skip to main content</a>
      <header class="site-header" id="site-header"></header>
      <main id="main" class="main" tabindex="-1">
        <div class="container page narrow">
          <h1>Administrator login</h1>
          <p class="muted">For campus lost &amp; found staff only.</p>
          <div id="login-alert"></div>
          <form class="form card pad" id="login-form" novalidate>
            <div class="field">
          <label for="email">Email <span class="req" aria-hidden="true"> *</span></label>
          <input id="email" required name="email" type="email" autocomplete="username">
        </div>
            <div class="field">
          <label for="password">Password <span class="req" aria-hidden="true"> *</span></label>
          <input id="password" required name="password" type="password" autocomplete="current-password">
        </div>
            <button type="submit" class="btn btn-primary" id="login-btn" disabled>Sign in</button>
          </form>
        </div>
      </main>
      <footer class="site-footer" id="site-footer"></footer>
    </div>
    <script type="module">
import { initAdminLogin } from './js/admin.js';
      initAdminLogin();
</script>
  </body>
</html>
